name: CI

on:
  push:
    branches: [main]
    # Tags are tested too. Release publishes from them, and without this a tagged commit could
    # ship having run nothing at all.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Any job needing more asks for it explicitly.
permissions:
  contents: read

# A new push to a pull request makes the previous run pointless, so cancel it. Runs on main are
# left alone because they gate releases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_NO_PROGRESS: "1"
  FORCE_COLOR: "1"
# Installs use `uv sync --locked`, which fails on a lock file that no longer matches
# pyproject.toml rather than quietly resolving something else. UV_FROZEN is deliberately not
# set here: uv rejects it alongside --locked.

jobs:
  duplicate:
    # Has this exact tree already been through this workflow and passed?
    #
    # The commit cannot answer that. This repository merges with a merge commit, so the SHA that
    # lands on main has never existed before and no lookup by commit can find the run that tested
    # its contents. The tree can: `refs/pull/N/merge` had exactly this tree when it went green,
    # and a version tag is a new ref on a commit main has already tested.
    #
    # A job rather than a step inside each of them, because the answer is one API conversation and
    # three jobs want it.
    name: Has this tree already passed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # A permissions block sets every scope it does not name to none, so `contents` is repeated
    # here rather than inherited. `deployed.yml` carries the same warning after the same surprise.
    permissions:
      contents: read
      # The verdict lives in this workflow's own run history, which `contents` cannot see. Read
      # rather than write: write is only needed to cancel other runs, which is off below.
      actions: read
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - id: check
        # A commit rather than a tag. This is somebody else's code, it holds `github.token`, it
        # stands in front of five of the six jobs here and it is inside the required check's
        # `needs`, so a tag repointed overnight is a tag repointed in the one place nothing else
        # is watching. The version it names is the same thing a reader wants from `@v5`, without
        # `@v5` being free to mean something else tomorrow.
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578  # v5.3.2
        with:
          github_token: ${{ github.token }}
          skip_after_successful_duplicate: "true"
          # The concurrency block above already decides what gets cancelled, and leaves main alone
          # on purpose because those runs gate releases. A second mechanism reaching a run on main
          # would take the image publish with it.
          cancel_others: "false"
          # Two runs on main are two different commits and both need an answer.
          concurrent_skipping: "never"
          # The action's own default list plus `pull_request`. A pull request is where somebody is
          # waiting to read the result, and the work this fixes is duplicated after the merge
          # rather than before it. `workflow_dispatch` staying on the list is the escape hatch: a
          # manual run always runs everything, and publishes nothing.
          #
          # `schedule` and `merge_group` are carried over from that default list and neither is a
          # trigger of this workflow, so both are inert. Left in rather than trimmed, because the
          # day somebody turns a merge queue on for main, `merge_group:` has to be added to `on:`
          # above or `CI` never reports and the queue waits on a check that cannot arrive.
          do_not_skip: '["workflow_dispatch", "schedule", "merge_group", "pull_request"]'

      - name: Say why
        env:
          SHOULD_SKIP: ${{ steps.check.outputs.should_skip }}
          REASON: ${{ steps.check.outputs.reason }}
          SKIPPED_BY: ${{ steps.check.outputs.skipped_by }}
        run: echo "should_skip=$SHOULD_SKIP reason=$REASON skipped_by=$SKIPPED_BY"

  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [duplicate]
    # `!cancelled()` rather than a plain comparison, and it is load-bearing twice. An `if` holding
    # no status-check function has an implicit `success()` added to it, which would make a
    # duplicate check that BROKE skip this job rather than run it. Fail open: a broken optimiser
    # costs a rebuild, it must not cost a check that nobody ran. `!=` for the same reason, since a
    # failed gate leaves the output an empty string. Not `always()`, so a superseded pull request
    # run still stops dead.
    if: >-
      !cancelled() &&
      needs.duplicate.outputs.should_skip != 'true'
    steps:
      - uses: actions/checkout@v7

      # Pinned to the floor rather than left to resolve. Both checkers are configured for 3.12,
      # and a checker run on a newer interpreter quietly stops enforcing the version this project
      # says it supports.
      - uses: astral-sh/setup-uv@v7
        with:
          # Pinned for the reason the matrix job below gives at length.
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - run: uv sync --extra dev --locked

      # The github format turns findings into inline annotations on the diff.
      - name: Ruff
        run: uv run ruff check --output-format=github .

      - name: Formatting
        run: uv run ruff format --check --diff .

      # Two checkers, because they disagree and each waves through what the other catches. Both
      # carry a shrinking list of files that are not clean yet; anything outside that list has to
      # stay clean, which is what stops the tree drifting back while the list is worked through.
      - name: Types (mypy)
        run: uv run mypy

      - name: Types (pyright)
        run: uv run pyright

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [duplicate]
    # `!cancelled()` rather than a plain comparison, and it is load-bearing twice. An `if` holding
    # no status-check function has an implicit `success()` added to it, which would make a
    # duplicate check that BROKE skip this job rather than run it. Fail open: a broken optimiser
    # costs a rebuild, it must not cost a check that nobody ran. `!=` for the same reason, since a
    # failed gate leaves the output an empty string. Not `always()`, so a superseded pull request
    # run still stops dead.
    if: >-
      !cancelled() &&
      needs.duplicate.outputs.should_skip != 'true'
    strategy:
      # One version failing should not hide the result for the others.
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shannon
          POSTGRES_PASSWORD: shannon
          POSTGRES_DB: shannon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shannon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SHANNON_TEST_DATABASE_URL: postgresql+asyncpg://shannon:shannon@localhost:5432/shannon_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          # Pinned because the alternative is not "no pin", it is "whatever uv released this
          # morning". Unpinned, the action asks a raw.githubusercontent.com endpoint which
          # version that is, on every leg of the matrix, and a build that has changed nothing
          # can start failing on a release nobody here made. An exact version skips that
          # question; a range does not, because the action resolves a range by asking anyway.
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}

      - run: uv sync --extra dev --locked

      - name: Test
        # Coverage on one version rather than all three. The answer does not differ between
        # them, nothing here branches on the Python version, and a floor enforced three times is
        # three chances for one flaky test to fail the build over a number.
        run: >-
          uv run pytest -q --durations=10
          ${{ matrix.python == '3.14' && '--cov' || '' }}

      - name: Confirm the suite still passes without a database
        # A fresh clone has no PostgreSQL, and the integration tier is supposed to skip rather
        # than fail. This is the only step that proves it.
        env:
          SHANNON_TEST_DATABASE_URL: ""
        run: uv run pytest -q

  image:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [duplicate]
    # `!cancelled()` rather than a plain comparison, and it is load-bearing twice. An `if` holding
    # no status-check function has an implicit `success()` added to it, which would make a
    # duplicate check that BROKE skip this job rather than run it. Fail open: a broken optimiser
    # costs a rebuild, it must not cost a check that nobody ran. `!=` for the same reason, since a
    # failed gate leaves the output an empty string. Not `always()`, so a superseded pull request
    # run still stops dead.
    if: >-
      !cancelled() &&
      needs.duplicate.outputs.should_skip != 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shannon
          POSTGRES_PASSWORD: shannon
          POSTGRES_DB: shannon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shannon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://shannon:shannon@localhost:5432/shannon
      WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: shannon-bot:ci
          # Layer cache lives in the Actions cache, so unchanged dependency layers are reused.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Apply migrations from the image
        run: |
          docker run --rm --network host \
            -e SHANNON_DATABASE_URL="$DATABASE_URL" \
            shannon-bot:ci alembic upgrade head

      - name: Start the container
        run: |
          docker run -d --name shannon --network host \
            -e SHANNON_DATABASE_URL="$DATABASE_URL" \
            -e SHANNON_GITHUB_WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            shannon-bot:ci

      - name: Wait for it to report healthy
        run: |
          # Long enough for Docker to reach a verdict, rather than long enough for the loop to
          # run out. `HEALTHCHECK` in the Dockerfile is --start-period=20s --interval=15s
          # --retries=5, so the earliest a sick container can SAY it is unhealthy is about
          # ninety-five seconds. At sixty the break below was unreachable: every dead container
          # ran the loop out and was reported as one that never answered, which is a different
          # fault from one that answered no. A healthy container replies on the first probe at
          # around fifteen seconds either way.
          for _ in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' shannon)
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "container never became healthy"
          docker logs shannon
          exit 1

      - name: A correctly signed delivery is accepted
        run: |
          body='{"action":"opened"}'
          signature="sha256=$(printf '%s' "$body" \
            | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')"
          code=$(curl -s -o /tmp/body -w '%{http_code}' -X POST \
            http://localhost:8000/webhooks/github \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: pull_request' \
            -H 'X-GitHub-Delivery: ci-1' \
            -H "X-Hub-Signature-256: $signature" \
            --data "$body")
          echo "$code $(cat /tmp/body)"
          [ "$code" = "200" ] || { docker logs shannon; exit 1; }

      - name: An unsigned delivery is rejected
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8000/webhooks/github \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: pull_request' \
            -H 'X-GitHub-Delivery: ci-2' \
            --data '{"action":"opened"}')
          [ "$code" = "401" ] || { echo "expected 401, got $code"; docker logs shannon; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs shannon || true

  audit:
    # Not gated on the duplicate check above, and not by oversight. Everything else here
    # reads the tree and nothing else, so a tree that passed passes again. This one asks what
    # is known TODAY: `pip-audit` against a database that moves on a day nobody pushed
    # anything, and `gitleaks` over the whole history. A tree that was clean last week is not
    # evidence that it is clean now. It is also the job that stops `publish` firing off a run
    # in which nothing ran, which is what the condition on `publish` rests on.
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan past commits, not just the working tree.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          # Pinned for the reason the matrix job gives. It matters most here: this is the one job
          # that runs whatever else was skipped, so it is the one whose red nobody can dismiss.
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Known vulnerabilities in runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt -o requirements.audit.txt
          # The tool is pinned and the advisory database is not, which is the whole point: the
          # question this asks has to be about today, but a pip-audit release that changes its
          # CLI must not be able to turn the only unconditional job red on its own.
          uvx pip-audit@2.10.1 --strict --requirement requirements.audit.txt

      - name: Committed secrets
        run: |
          # Same rule as pip-audit above: `latest` here means the secret scan can start failing,
          # or quietly start passing, on a day nobody pushed anything.
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            detect --source=. --redact --verbose --no-banner

  ci:
    # Single required check to protect the branch with, so the matrix can grow without
    # anyone having to update branch protection.
    name: CI
    runs-on: ubuntu-latest
    needs: [duplicate, quality, test, image, audit]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Fail if anything upstream failed
        run: |
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ] || exit 1
          [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ] || exit 1

  publish:
    # The image is published from a commit that has just passed everything above it, or from one
    # whose tree passed the last time this workflow saw it. So the question is whether anything
    # FAILED rather than whether everything succeeded: a job the duplicate check skipped did not
    # fail, and a job in `needs` that is skipped skips the job that needs it. Read the strict way,
    # every merge commit would publish no image at all, `deploy.sh` would refuse to deploy main
    # for ever because there is no `sha-<commit>` in the registry, and the hourly drift issue
    # would report CI green and send somebody to run that deploy.
    #
    # That question is the one `CI` already asks, so this asks `CI` rather than asking it again
    # over a list of its own. The two lists were not the same list. This one never held
    # `duplicate`, and the gate fails open on purpose, so a gate that BROKE left the other jobs
    # running and passing, `CI` red on the gate itself, and an image published from a red run by
    # a job looking at the four that went green. Depending on the required check directly is the
    # only version of "published exactly when `CI` is green" that a job added to the matrix
    # tomorrow cannot quietly undo.
    #
    # It still rests on at least one job above `CI` running unconditionally, and `audit` is that
    # job: gating it would leave a run in which everything skipped concluding success, and this
    # would publish out of it.
    name: Publish
    needs: [ci]
    if: >-
      !cancelled() &&
      needs.ci.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
