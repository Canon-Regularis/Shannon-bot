[project]
name = "shannon-bot"
version = "0.1.0"
description = "Discord bot that syncs GitHub repository activity into Discord"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    # Signing the GitHub App's JWT, and nothing else. A JWT library would be the conventional
    # pick, but this only ever SIGNS and never verifies, so the whole of what one buys - safe
    # verification of somebody else's token - goes unused, and it pulls this in regardless.
    "cryptography>=43.0.0",
    "discord-py>=2.7.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.165.3",
    # Two checkers rather than one. Pyright is the engine behind Pylance, so what an editor shows
    # is what CI enforces; mypy disagrees with it often enough to be worth the second opinion.
    "mypy>=1.18.0",
    "pyright>=1.1.400",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14.0",
]

[project.scripts]
shannon = "shannon.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shannon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A marker that is not declared below now fails collection. Both of them are applied to whole
# tiers and never typed by hand, so the only thing this can catch is a new one somebody invented,
# which is exactly when a warning would be missed among the others.
addopts = ["--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Nothing here is allowed to wait for ever. A good many tests poll for something a background
# task does on its own schedule, and the honest ones are bounded by `asyncio.timeout`. An
# unbounded one runs to the job's fifteen minute ceiling and is killed by the runner, which
# reports a cancelled job and no test name at all. This reports the test name.
#
# Sixty seconds against a slowest test of about eight, measured under coverage on the slowest
# machine to hand, so it is far enough above the real spread to say nothing about a loaded
# runner. It is also a fifteenth of `timeout-minutes`, so a stuck test costs a minute of CI
# rather than the whole job. `timeout_method` is left alone deliberately: the default picks
# `signal` where there is one, which prints the stack of the test that hung, and falls back to
# a thread on Windows.
timeout = 60
markers = [
    "integration: requires a live PostgreSQL instance (SHANNON_TEST_DATABASE_URL)",
    # Applied to the whole tier by `tests/unit/conftest.py` rather than file by file. It was on
    # 32 of 88 files, so `-m unit` selected a third of the unit tests and read as though it
    # selected all of them.
    "unit: needs nothing but the interpreter",
]
filterwarnings = [
    # A deprecation warning from our own code is a bug to fix, not a note to read later.
    "error::DeprecationWarning:shannon.*",
    # discord.py 2.7 passes re.sub's `count` positionally, which Python 3.13 deprecated. It is
    # their code and there is nothing to do here but wait for a release that fixes it. Left
    # alone it is a thousand lines of noise per run, which is more than enough to bury a
    # warning that does matter.
    "ignore:'count' is passed as positional argument:DeprecationWarning",
]

[tool.coverage.run]
source = ["shannon"]
# Statements alone say every line ran, which a suite manages easily while never taking a branch
# the other way. With this on, the figure below covers both.
branch = true

[tool.coverage.report]
# A floor rather than a target: both are complete today, so anything under it is a regression.
# Worth saying what it does not mean. A line running is not a behaviour being asserted, and this
# catches code nothing executes, which is a narrower thing than code nothing checks.
#
# Twice over, at a hundred per cent. Five properties ran fifteen hundred examples through the
# webhook parsers and asserted nothing, every one of them dying at the first guard; and the
# gateway tests pinned twenty-two keyword assertions against a mock that would have accepted any
# keyword at all. Both were covered the whole time, and the number did not move when either
# was fixed.
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# Two type checkers, both gating. Pyright is the engine behind Pylance, so an error in the editor
# is an error in CI and there is no second list to keep in your head; mypy is run beside it because
# the two disagree, and each catches things the other waves through.
#
# Pinned to the floor rather than to what development happens to run, so anything that only works
# on a newer interpreter is caught here rather than by the 3.12 leg of the test matrix.
#
# `Any` is allowed only where data genuinely arrives untyped: `json.loads` and `response.json()`.
# It gets narrowed on the next line. Everywhere else it is a defect, which is what strict enforces.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["shannon", "tests"]
# A suppression has to name what it is suppressing, so that a later fix can find it again.
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Tests are checked, but not held to the source's standard. They are full of fixtures whose types
# pytest supplies, gateways subclassed inline to fail on demand, and mocks that are `Any` by
# construction, and forcing those into strict form buys noise rather than correctness.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

# The ratchet. Every file below still fails one of the two checkers, and each is here so the gate
# can be switched on today rather than after the whole tree is clean. A file leaves this list when
# it is fixed and never goes back, and anything NOT listed is gated from the moment it is written,
# which is the property that makes this worth doing before the work is finished rather than after.
[[tool.mypy.overrides]]
