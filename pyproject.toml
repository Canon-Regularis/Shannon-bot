# Pyright honours per-rule overrides in an execution environment but NOT `typeCheckingMode`, so
# holding the tests to standard means naming the rules strict adds. This list was derived by
# running the tree at both levels and taking the difference, rather than read off the docs.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportMissingTypeStubs = "none"
# A test reaching for a private name is usually reading the thing it is testing.
reportPrivateUsage = "none"
reportDeprecated = "none"
# Ruff already fails the build on an unused import, under F401.
reportUnusedImport = "none"
