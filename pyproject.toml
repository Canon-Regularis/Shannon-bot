ignore_errors = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["shannon", "tests"]
# The same ratchet, in pyright's dialect. The two lists differ because the two tools do.
ignore = [
    # Not on this list because it is old. It is here because `FakeInteraction` cannot satisfy
    # `discord.Interaction`, which is a concrete generic class, so every command test in the
    # project is in the same position and every one of them is listed below.
    #
    # A narrow protocol naming what the commands actually read was tried and does not work.
    # `Interaction.response` is a `CachedSlotProperty`, and while reading it resolves to
    # `InteractionResponse`, pyright compares the descriptor itself when matching a protocol
    # and reports `is_done` as absent. A read-only property member and a plain attribute member
    # both fail the same way, so nothing that has to call `reply()` can be typed this way.
    "tests/unit/commands/test_people_commands.py",
    "tests/unit/commands/test_label_commands.py",
    "tests/unit/commands/test_conversation_commands.py",
    "tests/fakes/github.py",
