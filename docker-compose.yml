services:
  db:
    image: postgres:17-alpine
    # Defaults are throwaway local credentials. Override them in .env for anything that is not
    # a laptop, so no real password is ever written into a tracked file.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shannon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shannon}
      POSTGRES_DB: ${POSTGRES_DB:-shannon}
    # Host port is 5433 so this never fights a natively installed PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - shannon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-shannon}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs to completion before the app starts, so the schema is never applied by two replicas
  # racing each other at boot.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      # Not read from .env, deliberately. See the note on the app service below.
      SHANNON_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shannon}:${POSTGRES_PASSWORD:-shannon}@db:5432/${POSTGRES_DB:-shannon}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is reached by service name on 5432. The 5433
      # mapping above is for reaching it from the host.
      #
      # Written out rather than interpolated from the environment, which is what it used to do and
      # which made the documented install impossible: Compose reads ./.env for interpolation, the
      # README says to start with `cp .env.example .env`, and that file carries the host's
      # localhost:5433 URL. So `${SHANNON_DATABASE_URL:-...}` never fell back to the default and
      # handed both containers their own loopback, where nothing is listening. `migrate` died on
      # connection refused and `app` waited on it for ever. This is the one setting whose value
      # inside the network is not the value outside it, so it is the one the file decides.
      SHANNON_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shannon}:${POSTGRES_PASSWORD:-shannon}@db:5432/${POSTGRES_DB:-shannon}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Two shutdown budgets run one after the other and were each sized against Docker's ten
    # second default without either knowing about the other. `worker_shutdown_grace_seconds`
    # (5s) waits for the delivery in hand; cancelling the worker then unwinds into
    # `ItemThreads._open`, which waits up to `CLAIM_GRACE_SECONDS` (10s) for a thread Discord
    # has been asked for and not yet answered about. Measured end to end at just over fifteen
    # seconds when discord.py is sitting out a rate limit.
    #
    # Killed before that finishes, the worker never hands back the rest of its leased batch, so
    # up to nine other deliveries sit PROCESSING until their fifteen minute lease lapses. The
    # replacement process polls a queue that looks empty and those items get no thread for a
    # quarter of an hour, with nothing in either log saying why. Docker Desktop is worse than
    # the documented default: it stops containers after about one and a half seconds.
    stop_grace_period: 30s

volumes:
  shannon-pgdata:
